<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Washington State Covid Map</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.5.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.5.0/mapbox-gl.js"></script>
    <style>
        h2, h3 {
            margin: 10px;
            font-size: 18px;
        }

        h3 {
            font-size: 16px;
        }

        p {
            margin: 10px;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
        }

        .map-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            background: rgba(255, 255, 255, 0.8);
            border-style: solid;
            border-width: 1px;
            border-color: rgba(0, 0, 0, 0.2);
            margin-left: 20px;
            font-family: Arial, sans-serif;
            overflow: visible;
            border-radius: 3px;
            height: auto;
            padding: 10px;
            min-height: fit-content;
            text-align: center;
        }

        #features {
            top: 0;
            height: 100px;
            margin-top: 20px;
            width: 250px;
        }

        #legend {
            padding: 15px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            line-height: 18px;
            height: auto;
            margin-bottom: 40px;
            width: 175px;
            text-align: center;
            min-height: fit-content;
        }

        .legend-key {
            display: inline-block;
            border-radius: 20%;
            width: 10px;
            height: 10px;
            margin-right: 5px;
            align-items: center;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <div class='map-overlay' id='features'>
        <h2>Covid Vaccination Rate</h2>
        <div id='text-description'>
            <p>Hover over a County!</p>
        </div>
    </div>
    <div class='map-overlay' id='legend'></div>
    <script>
        mapboxgl.accessToken = 'pk.eyJ1Ijoid2lsbHNlbmVua28iLCJhIjoiY21oNm9tenlzMGxmNzJpb211eWN4OWhzMiJ9.CNtId7OzmVwm4EajEwdCGg';

        const map = new mapboxgl.Map({
                container: 'map', // container ID
                style: 'mapbox://styles/mapbox/light-v10', // style URL
                zoom: 6.8, // starting zoom
                center: [-121, 47.3] // starting center
            }
        );

        async function geojsonFetch() { 
            let response = await fetch('assets/wa-covid-data-102521.geojson');
            let covidData = await response.json();

            map.on('load', function loadingData() {
                    map.addSource('covidData', {
                    type: 'geojson',
                    data: covidData
                });

                map.addLayer({
                    'id': 'covidData-layer',
                    'type': 'fill',
                    'source': 'covidData',
                    'paint': {
                        'fill-color': [
                            'step',
                            ['get', 'fullyVaxPer10k'],
                            '#FFEDA0', 3000,  // 3000+
                            '#FED976', 4000,  // 4000+
                            '#FEB24C', 5000,  // 5000+
                            '#FD8D3C', 6000,  // 6000+
                            '#FC4E2A', 7000,  // 7000+
                            '#E31A1C' // 8000+
                        ],
                        'fill-outline-color': '#BBBBBB',
                        'fill-opacity': 0.7,
                    }
                });

                map.addLayer({
                    'id': 'covidData-borders',
                    'type': 'line',
                    'source': 'covidData',
                    'paint': {
                        'line-color': 'black',   // border color
                        'line-width': 1            // thickness in pixels
                    }
                });

                const layers = [
                    '3000-3999',
                    '4000-4999',
                    '5000-5999',
                    '6000-6999',
                    '7000-7499',
                    '7500+'
                ];
                const colors = [
                    '#FFEDA070',  
                    '#FED97670', 
                    '#FEB24C70', 
                    '#FD8D3C70', 
                    '#FC4E2A70', 
                    '#E31A1C70'
                ];
                
                const legend = document.getElementById('legend');
                legend.innerHTML = "<b>Vacination Numbers\nBy Country (1/10k)<br><br>";

                layers.forEach((layer, i) => {
                    const color = colors[i];
                    const item = document.createElement('div');
                    const key = document.createElement('span');
                    key.className = 'legend-key';
                    key.style.backgroundColor = color;

                    const value = document.createElement('span');
                    value.innerHTML = `${layer}`;
                    item.appendChild(key);
                    item.appendChild(value);
                    legend.appendChild(item);
                });
            });
        }
        

        map.on('mousemove', ({point}) => {
            const covidData = map.queryRenderedFeatures(point, {
                layers: ['covidData-layer']
            });
            document.getElementById('text-description').innerHTML = covidData.length ?
                `<h3>${covidData[0].properties.name} County</h3><p><strong><em>${covidData[0].properties.fullyVaxPer10k}</strong> Vaccinated per 10,000 residents</em></p>` :
                `<p>Hover over a County!</p>`;
        });
        

        geojsonFetch();
    </script>

</body>

</html>
